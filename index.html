<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GYM PRO">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>GYM PRO - Tu Entrenamiento Personal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100;14..32,200;14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap');

        :root {
            --purple-primary: #8b5cf6;
            --purple-secondary: #a855f7;
            --purple-glow: #c084fc;
            --yellow-primary: #facc15;
            --yellow-secondary: #eab308;
            --black-bg: #000000;
            --gray-800: #1c1c1e;
            --gray-700: #2c2c2e;
            --gray-600: #3a3a3c;
            --gray-500: #8e8e93;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
            background: var(--black-bg);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body.light {
            --black-bg: #f5f5f7;
            --gray-800: #ffffff;
            --gray-700: #f5f5f7;
            --gray-600: #e5e5ea;
            --white: #000000;
        }

        /* Scroll suave */
        .scrollable {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        /* Header estilo iOS 26 */
        .header {
            padding: 0.75rem 1.25rem;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        body.light .header {
            background: rgba(255, 255, 255, 0.85);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.05);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }

        .logo-icon {
            font-size: 1.75rem;
            filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.5));
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--purple-primary), var(--yellow-primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .user-stats {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.375rem 0.875rem;
            border-radius: 40px;
            backdrop-filter: blur(20px);
        }

        .level-badge {
            background: linear-gradient(135deg, var(--yellow-primary), var(--yellow-secondary));
            padding: 0.25rem 0.625rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #000;
        }

        /* Tab Bar estilo iOS 26 (como Apple Music) */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(40px);
            border-top: 0.5px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 0.5rem 1rem 1rem;
            z-index: 100;
        }

        body.light .tab-bar {
            background: rgba(255, 255, 255, 0.85);
            border-top: 0.5px solid rgba(0, 0, 0, 0.05);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            background: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            padding: 0.25rem 0.75rem;
            border-radius: 32px;
        }

        .tab-icon {
            font-size: 1.5rem;
            opacity: 0.6;
            transition: all 0.2s;
        }

        .tab-label {
            font-size: 0.625rem;
            font-weight: 500;
            opacity: 0.6;
        }

        .tab-item.active .tab-icon,
        .tab-item.active .tab-label {
            opacity: 1;
            color: var(--purple-primary);
        }

        .tab-item.active .tab-icon {
            transform: scale(1.05);
        }

        /* Contenedor principal */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem 1rem 5rem;
        }

        /* Cards estilo iOS 26 */
        .card {
            background: var(--gray-800);
            border-radius: 24px;
            margin-bottom: 1rem;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-header {
            padding: 1rem 1.25rem 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .card-content {
            padding: 0.25rem 1.25rem 1.25rem;
        }

        /* Hero card (día actual) */
        .hero-card {
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-secondary));
            border-radius: 32px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-day {
            font-size: 0.875rem;
            font-weight: 500;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero-routine {
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0.5rem 0;
        }

        .hero-exercises {
            font-size: 0.875rem;
            opacity: 0.9;
            margin-bottom: 1rem;
        }

        /* Botón principal */
        .btn-primary {
            background: var(--yellow-primary);
            border: none;
            padding: 1rem;
            border-radius: 56px;
            font-size: 1rem;
            font-weight: 700;
            color: #000;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        /* Lista de ejercicios */
        .exercise-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        body.light .exercise-row {
            border-bottom-color: rgba(0, 0, 0, 0.05);
        }

        .exercise-name {
            font-weight: 500;
        }

        .exercise-stats {
            font-size: 0.75rem;
            color: var(--gray-500);
        }

        /* Estadísticas circulares */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .stat-circle {
            background: var(--gray-700);
            border-radius: 20px;
            padding: 1rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--purple-primary), var(--yellow-primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Temporizador */
        .timer-modal {
            position: fixed;
            bottom: 100px;
            left: 20px;
            right: 20px;
            background: var(--gray-800);
            backdrop-filter: blur(40px);
            border-radius: 32px;
            padding: 1.5rem;
            text-align: center;
            z-index: 200;
            transform: translateY(200%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
        }

        .timer-modal.active {
            transform: translateY(0);
        }

        .timer-display {
            font-size: 3rem;
            font-weight: 800;
            font-feature-settings: "tnum";
            margin: 1rem 0;
        }

        /* Pantalla de entrenamiento */
        .workout-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--black-bg);
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .workout-screen.active {
            display: flex;
            animation: slideUp 0.4s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .workout-header {
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(40px);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        .back-btn {
            background: var(--gray-700);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--white);
        }

        .workout-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .current-exercise-card {
            background: var(--gray-800);
            border-radius: 32px;
            padding: 2rem;
            text-align: center;
        }

        .exercise-big-name {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--purple-primary), var(--yellow-primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .weight-controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 1.5rem 0;
        }

        .weight-input, .reps-input {
            background: var(--gray-700);
            border: none;
            padding: 0.875rem;
            border-radius: 16px;
            color: var(--white);
            font-size: 1rem;
            text-align: center;
            width: 110px;
        }

        .suggestion-bubble {
            background: rgba(139, 92, 246, 0.2);
            border-radius: 20px;
            padding: 0.75rem;
            margin: 1rem 0;
            font-size: 0.875rem;
            border-left: 3px solid var(--purple-primary);
        }

        .series-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            margin: 1.5rem 0;
        }

        .series-btn {
            background: var(--gray-700);
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 40px;
            font-weight: 600;
            color: var(--white);
            cursor: pointer;
            transition: all 0.2s;
        }

        .series-btn.active {
            background: var(--yellow-primary);
            color: #000;
            transform: scale(1.05);
        }

        .series-btn.completed {
            background: #34c759;
            color: white;
        }

        /* Toast notificación */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(40px);
            border-radius: 56px;
            padding: 1rem;
            text-align: center;
            z-index: 1100;
            animation: fadeInUp 0.3s ease;
            font-weight: 500;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--gray-800);
            border-radius: 32px;
            padding: 1.5rem;
            max-width: 400px;
            width: 100%;
        }

        .install-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--purple-primary);
            text-align: center;
            padding: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            z-index: 150;
        }

        .rest-timer-btn {
            background: var(--gray-700);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <div class="logo-area">
                <span class="logo-icon">🏋️‍♂️</span>
                <span class="logo-text">GYM PRO</span>
            </div>
            <div class="user-stats">
                <span id="userNameDisplay">Atleta</span>
                <span class="level-badge" id="levelBadge">Nv 1</span>
            </div>
        </div>
    </div>

    <div class="container" id="app"></div>

    <div class="tab-bar" id="tabBar">
        <button class="tab-item active" data-tab="home">
            <div class="tab-icon">🏠</div>
            <div class="tab-label">Inicio</div>
        </button>
        <button class="tab-item" data-tab="progress">
            <div class="tab-icon">📊</div>
            <div class="tab-label">Progreso</div>
        </button>
        <button class="tab-item" data-tab="exercises">
            <div class="tab-icon">💪</div>
            <div class="tab-label">Ejercicios</div>
        </button>
        <button class="tab-item" data-tab="music">
            <div class="tab-icon">🎵</div>
            <div class="tab-label">Música</div>
        </button>
        <button class="tab-item" data-tab="settings">
            <div class="tab-icon">⚙️</div>
            <div class="tab-label">Ajustes</div>
        </button>
    </div>

    <div id="workoutScreen" class="workout-screen">
        <div class="workout-header">
            <button class="back-btn" onclick="closeWorkout()">←</button>
            <span style="font-weight: 600;" id="workoutTitle"></span>
        </div>
        <div class="workout-content" id="workoutContent"></div>
    </div>

    <div id="timerModal" class="timer-modal">
        <div style="font-weight: 600;">⏱️ Descanso</div>
        <div class="timer-display" id="timerDisplay">01:00</div>
        <div style="display: flex; gap: 0.5rem; justify-content: center;">
            <button class="rest-timer-btn" onclick="adjustTimer(-15)">-15s</button>
            <button class="rest-timer-btn" onclick="adjustTimer(15)">+15s</button>
        </div>
        <button class="btn-primary" style="margin-top: 1rem;" onclick="stopTimer()">Cerrar</button>
    </div>

    <div id="welcomeModal" class="modal">
        <div class="modal-content">
            <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">👋 Bienvenido</h2>
            <p style="margin-bottom: 1rem;">¿Cómo quieres que te llame?</p>
            <input type="text" id="welcomeName" placeholder="Tu nombre" style="width: 100%; padding: 0.75rem; border-radius: 12px; border: none; background: var(--gray-700); color: var(--white);">
            <button class="btn-primary" style="margin-top: 1rem;" onclick="setWelcomeName()">Comenzar</button>
        </div>
    </div>

    <div id="installBanner" class="install-banner" onclick="promptInstall()">
        📲 Instalar GYM PRO - Experiencia completa
    </div>

    <script src="app.js"></script>
</body>
</html>
