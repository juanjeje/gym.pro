<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GYM PRO">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>GYM PRO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100;14..32,200;14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap');

        :root {
            --purple-primary: #8b5cf6;
            --purple-secondary: #a855f7;
            --purple-glow: #c084fc;
            --yellow-primary: #facc15;
            --yellow-secondary: #eab308;
            --black-bg: #000000;
            --gray-800: #1c1c1e;
            --gray-700: #2c2c2e;
            --gray-600: #3a3a3c;
            --gray-500: #8e8e93;
            --white: #ffffff;
            --success: #34c759;
            --danger: #ff3b30;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--black-bg);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body.light {
            --black-bg: #f5f5f7;
            --gray-800: #ffffff;
            --gray-700: #f5f5f7;
            --gray-600: #e5e5ea;
            --white: #000000;
        }

        .header {
            padding: 0.75rem 1.25rem;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(40px);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        body.light .header {
            background: rgba(255, 255, 255, 0.85);
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.05);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--purple-primary), var(--yellow-primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .user-stats {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.375rem 0.875rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .level-badge {
            background: linear-gradient(135deg, var(--yellow-primary), var(--yellow-secondary));
            padding: 0.25rem 0.625rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #000;
        }

        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(40px);
            border-top: 0.5px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 0.5rem 1rem 1rem;
            z-index: 100;
        }

        body.light .tab-bar {
            background: rgba(255, 255, 255, 0.85);
            border-top: 0.5px solid rgba(0, 0, 0, 0.05);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.25rem 0.75rem;
            border-radius: 32px;
            transition: all 0.2s ease;
        }

        .tab-icon {
            font-size: 1.5rem;
            opacity: 0.6;
            transition: all 0.2s;
        }

        .tab-label {
            font-size: 0.625rem;
            font-weight: 500;
            opacity: 0.6;
        }

        .tab-item.active .tab-icon,
        .tab-item.active .tab-label {
            opacity: 1;
            color: var(--purple-primary);
        }

        .tab-item.active .tab-icon {
            transform: scale(1.05);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem 1rem 5rem;
        }

        .card {
            background: var(--gray-800);
            border-radius: 24px;
            margin-bottom: 1rem;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .card-header {
            padding: 1rem 1.25rem 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .card-content {
            padding: 0.25rem 1.25rem 1.25rem;
        }

        .hero-card {
            background: linear-gradient(135deg, var(--purple-primary), var(--purple-secondary));
            border-radius: 32px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-day {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .hero-routine {
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0.5rem 0;
            letter-spacing: -0.5px;
        }

        .hero-subtitle {
            font-size: 0.875rem;
            opacity: 0.8;
            margin-bottom: 1rem;
        }

        .btn-primary {
            background: var(--yellow-primary);
            border: none;
            padding: 1rem;
            border-radius: 56px;
            font-size: 1rem;
            font-weight: 600;
            color: #000;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--gray-700);
            border: none;
            padding: 0.75rem;
            border-radius: 40px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--white);
            transition: all 0.2s;
        }

        .btn-secondary:active {
            opacity: 0.7;
        }

        .exercise-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        body.light .exercise-item {
            border-bottom-color: rgba(0, 0, 0, 0.05);
        }

        .exercise-name {
            font-weight: 500;
        }

        .exercise-sets {
            font-size: 0.75rem;
            color: var(--gray-500);
        }

        .edit-btn {
            background: var(--purple-primary);
            border: none;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--gray-800);
            border-radius: 32px;
            padding: 1.5rem;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content input,
        .modal-content select,
        .modal-content textarea {
            width: 100%;
            padding: 0.75rem;
            margin: 0.5rem 0;
            border-radius: 12px;
            border: none;
            background: var(--gray-700);
            color: var(--white);
            font-size: 1rem;
            font-family: inherit;
        }

        .modal-content h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .workout-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--black-bg);
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .workout-screen.active {
            display: flex;
            animation: slideUp 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .workout-header {
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(40px);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        .back-btn {
            background: var(--gray-700);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.25rem;
            cursor: pointer;
            color: var(--white);
            transition: all 0.2s;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .toast {
            position: fixed;
            bottom: 90px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(40px);
            border-radius: 56px;
            padding: 1rem;
            text-align: center;
            z-index: 1100;
            font-weight: 500;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--purple-primary), var(--yellow-primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .install-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--purple-primary);
            text-align: center;
            padding: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: none;
            z-index: 150;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            text-align: center;
        }

        .progress-bar {
            height: 6px;
            background: var(--gray-700);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--yellow-primary);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .message {
            max-width: 85%;
            padding: 0.75rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            line-height: 1.4;
        }

        .message.user {
            background: var(--purple-primary);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background: var(--gray-700);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .quick-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0 1rem;
        }

        .chat-input-area {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            border-top: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        body.light .chat-input-area {
            border-top-color: rgba(0, 0, 0, 0.05);
        }

        .chat-input {
            flex: 1;
            background: var(--gray-700);
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 40px;
            color: var(--white);
            font-size: 0.875rem;
            font-family: inherit;
        }

        .send-btn {
            background: var(--purple-primary);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .series-btn {
            background: var(--gray-700);
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 40px;
            margin: 0.25rem;
            color: var(--white);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .series-btn:active {
            transform: scale(0.95);
        }

        .weight-input, .reps-input {
            background: var(--gray-700);
            border: none;
            padding: 0.75rem;
            border-radius: 16px;
            width: 110px;
            color: var(--white);
            text-align: center;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <span class="logo-text">GYM PRO</span>
            <div class="user-stats">
                <span id="userNameDisplay">Atleta</span>
                <span class="level-badge" id="levelBadge">Nv 1</span>
            </div>
        </div>
    </div>

    <div class="container" id="app"></div>

    <div class="tab-bar" id="tabBar">
        <button class="tab-item active" data-tab="home">
            <div class="tab-icon">🏠</div>
            <div class="tab-label">Inicio</div>
        </button>
        <button class="tab-item" data-tab="routines">
            <div class="tab-icon">📋</div>
            <div class="tab-label">Rutinas</div>
        </button>
        <button class="tab-item" data-tab="progress">
            <div class="tab-icon">📊</div>
            <div class="tab-label">Progreso</div>
        </button>
        <button class="tab-item" data-tab="coach">
            <div class="tab-icon">🤖</div>
            <div class="tab-label">Coach IA</div>
        </button>
        <button class="tab-item" data-tab="settings">
            <div class="tab-icon">⚙️</div>
            <div class="tab-label">Ajustes</div>
        </button>
    </div>

    <div id="workoutScreen" class="workout-screen">
        <div class="workout-header">
            <button class="back-btn" onclick="closeWorkout()">←</button>
            <span style="font-weight: 600;" id="workoutTitle"></span>
        </div>
        <div class="workout-content" id="workoutContent" style="flex:1; overflow-y:auto; padding:1.5rem;"></div>
    </div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h2>Bienvenido a GYM PRO</h2>
            <p style="margin-bottom: 1rem; opacity: 0.7;">Configura tu perfil para comenzar</p>
            <input type="text" id="regName" placeholder="Tu nombre" autocomplete="off">
            <input type="number" id="regWeight" placeholder="Peso (kg)" step="0.1">
            <input type="number" id="regHeight" placeholder="Altura (cm)">
            <select id="regGoal">
                <option value="Ganar masa muscular">Ganar masa muscular</option>
                <option value="Perder grasa">Perder grasa</option>
                <option value="Mantener forma">Mantener forma</option>
                <option value="Aumentar fuerza">Aumentar fuerza</option>
            </select>
            <button class="btn-primary" style="margin-top: 1rem;" onclick="saveUserProfile()">Comenzar</button>
        </div>
    </div>

    <div id="editRoutineModal" class="modal">
        <div class="modal-content">
            <h2 id="editRoutineTitle">Editar Rutina</h2>
            <div id="editExercisesList"></div>
            <button class="btn-secondary" onclick="addExerciseToEdit()">+ Agregar ejercicio</button>
            <button class="btn-primary" style="margin-top: 1rem;" onclick="saveEditedRoutine()">Guardar rutina</button>
            <button class="btn-secondary" style="margin-top: 0.5rem;" onclick="closeEditRoutineModal()">Cancelar</button>
        </div>
    </div>

    <div id="installBanner" class="install-banner" onclick="promptInstall()">
        Instalar GYM PRO - Experiencia completa
    </div>

    <script src="app.js"></script>
</body>
</html>
